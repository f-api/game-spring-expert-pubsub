<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>받은 메시지</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #b2c7da;
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, 'Helvetica Neue', sans-serif;
    display: flex;
    flex-direction: column;
  }
  header { padding: 14px 20px; }
  h1 { font-size: 16px; margin: 0; }
  .sub, .name, .time { color: #4a5a6a; }
  .sub { font-size: 12px; margin-top: 2px; }
  #room { flex: 1; overflow-y: auto; padding: 16px 16px 24px; }
  .notice {
    width: fit-content; margin: 8px auto 16px; padding: 5px 12px;
    background: rgba(0, 0, 0, 0.14); color: #fff; border-radius: 14px; font-size: 12px;
  }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row.next { margin-top: 4px; }
  .avatar {
    width: 38px; height: 38px; border-radius: 14px; flex: none;
    display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 700; background: #c8792a;
  }
  .row.next .avatar { visibility: hidden; height: 0; }
  .name { font-size: 12px; margin: 2px 0 5px; }
  .row.next .name { display: none; }
  .line { display: flex; align-items: flex-end; gap: 6px; }
  .bubble {
    max-width: 320px; background: #fff; padding: 8px 11px; font-size: 14px; line-height: 1.45;
    border-radius: 4px 14px 14px 14px; overflow-wrap: anywhere;
  }
  .row.next .bubble { border-radius: 14px; }
  .time { font-size: 11px; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="sub">구독 중인 채널에서 받은 메시지</div>
</header>
<div id="room">
  <div class="notice" id="empty">아직 받은 메시지가 없습니다</div>
</div>
<script>
  const category = new URLSearchParams(location.search).get('category');
  const room = document.getElementById('room');
  const empty = document.getElementById('empty');
  let first = true;

  if (!category) {
    document.getElementById('title').textContent = '구독할 분야가 없습니다';
    empty.textContent = '주소 끝에 ?category=sports 처럼 분야를 붙여 여세요';
  } else {
    document.getElementById('title').textContent = 'news:' + category;
    const source = new EventSource('/news/' + encodeURIComponent(category) + '/stream');
    source.onmessage = showMessage;
  }

  function showMessage(event) {
    const received = JSON.parse(event.data);
    const row = document.createElement('div');
    row.className = first ? 'row' : 'row next';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = category.charAt(0).toUpperCase();

    const content = document.createElement('div');
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = received.channel;
    const line = document.createElement('div');
    line.className = 'line';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = received.message;
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = new Date().toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });

    line.append(bubble, time);
    content.append(name, line);
    row.append(avatar, content);
    room.append(row);
    room.scrollTop = room.scrollHeight;
    if (first) empty.remove();
    first = false;
  }
</script>
</body>
</html>
